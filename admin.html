<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Mocha Tech Admin Control Panel</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
*{box-sizing:border-box}
:root{--bg:#020617;--card:#0f172a;--line:#1e293b;--txt:#e2e8f0;--mut:#94a3b8;--vio:#7c3aed;--ok:#10b981;--warn:#f59e0b;--bad:#f43f5e;--blue:#00D2FF}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh;padding:1rem}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
.ad-login{max-width:26rem;margin:5rem auto;background:var(--card);border:1px solid var(--line);border-radius:1.25rem;padding:2rem;text-align:center;box-shadow:0 25px 50px -12px rgba(0,0,0,.6)}
.ad-login h1{font-size:1.5rem;font-weight:900;margin:.5rem 0}.ad-login p{font-size:.8rem;color:var(--mut)}
.ad-login form{display:grid;gap:.8rem;margin-top:1rem}.ad-login-icon{font-size:2rem;color:#8b5cf6}
.ad-input,.ad-select,.ad-area{width:100%;padding:.7rem .9rem;border-radius:.6rem;border:1px solid var(--line);background:var(--bg);color:#fff;font:inherit;font-size:.85rem}
.ad-area{min-height:4.5rem;resize:vertical}
.ad-input:focus,.ad-select:focus,.ad-area:focus{outline:none;border-color:#8b5cf6}
.ad-center{text-align:center;font-size:1.05rem}
.ad-btn{display:inline-flex;align-items:center;gap:.45rem;background:#1e293b;color:#fff;border:0;border-radius:.6rem;padding:.55rem 1rem;font:inherit;font-size:.75rem;font-weight:800;cursor:pointer;transition:.15s}
.ad-btn:hover{background:#334155}
.ad-btn-primary{background:#7c3aed}.ad-btn-primary:hover{background:#6d28d9}
.ad-btn-ok{background:#059669}.ad-btn-ok:hover{background:#047857}
.ad-btn-danger{background:#e11d48}.ad-btn-danger:hover{background:#be123c}
.ad-btn-sm{padding:.35rem .6rem}
.ad-block{width:100%;justify-content:center;padding:.8rem}
.ad-error{color:var(--bad)!important;font-size:.78rem!important;margin:0}
.ad-ok{color:var(--ok)}
.ad-head{max-width:64rem;margin:0 auto;display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:1rem}
.ad-head h1{margin:0;font-size:1.4rem;font-weight:900;color:#a78bfa}.ad-head h1 span{color:#fff}
.ad-head p{margin:.2rem 0 0;font-size:.75rem;color:var(--mut)}
.ad-head-actions{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.ad-pill{font-size:.7rem;font-weight:800;padding:.4rem .8rem;border-radius:999px;border:1px solid var(--line)}
.ad-pill.sync{color:var(--ok);border-color:rgba(16,185,129,.4)}.ad-pill.dirty{color:var(--warn);border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.08)}
.ad-tabs{max-width:64rem;margin:1rem auto 0;display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.4rem}
.ad-tab{flex:none;background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:.6rem;padding:.55rem .9rem;font:inherit;font-size:.75rem;font-weight:800;cursor:pointer}
.ad-tab.active{background:#7c3aed;color:#fff;border-color:#7c3aed}
.ad-main{max-width:64rem;margin:1rem auto 4rem}
.ad-card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1.4rem;margin-bottom:1rem}
.ad-card h2{margin:0 0 .3rem;font-size:1.1rem;font-weight:800;color:#c4b5fd}
.ad-card h3{margin:1.2rem 0 .5rem;font-size:.9rem;font-weight:800;color:#67e8f9}
.ad-desc{font-size:.78rem;color:var(--mut);margin:0 0 1rem;line-height:1.6}
.ad-grid{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr))}
.ad-field label{display:block;font-size:.72rem;font-weight:700;color:#cbd5e1;margin-bottom:.3rem}
.ad-hint{font-size:.68rem;color:var(--mut);margin-top:.25rem}.ad-hint.bad{color:var(--bad)}
.ad-row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.9rem}
.ad-switch{position:relative;display:inline-block;width:3.4rem;height:1.9rem;flex:none}
.ad-switch input{opacity:0;width:0;height:0}
.ad-switch span{position:absolute;inset:0;background:#334155;border-radius:999px;cursor:pointer;transition:.2s}
.ad-switch span::after{content:"";position:absolute;width:1.4rem;height:1.4rem;left:.25rem;top:.25rem;background:#fff;border-radius:50%;transition:.2s}
.ad-switch input:checked+span{background:#d97706}.ad-switch input:checked+span::after{transform:translateX(1.5rem)}
.ad-switch input:focus-visible+span{outline:3px solid #00D2FF;outline-offset:2px}
.ad-switch.green input:checked+span{background:#059669}
.ad-toggle{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.ad-status{font-size:.78rem;font-weight:800;margin-top:.8rem}
.ad-status.live{color:var(--ok)}.ad-status.off{color:var(--warn)}
.ad-steps{margin:.6rem 0 0;padding-left:1.2rem;font-size:.8rem;color:#cbd5e1;line-height:1.8}
.ad-item{background:var(--bg);border:1px solid var(--line);border-radius:.8rem;padding:.9rem;margin-bottom:.7rem}
.ad-item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;font-size:.72rem;font-weight:800;color:var(--mut)}
.ad-item-tools{display:flex;gap:.3rem}
.ad-thumb{width:6rem;height:4rem;object-fit:cover;border-radius:.5rem;border:1px solid var(--line)}
.ad-empty{font-size:.78rem;color:var(--mut)}
.ad-toast{position:fixed;right:1rem;bottom:1rem;background:#059669;color:#fff;font-size:.8rem;font-weight:800;padding:.7rem 1.1rem;border-radius:.7rem;opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s;z-index:50}
.ad-toast.show{opacity:1;transform:none}.ad-toast.warn{background:#d97706}.ad-toast.bad{background:#e11d48}
</style>
    <script src="firebase-config.js"></script>
    <script src="config.js"></script>
    <script src="core.js"></script>
</head>
<body>
    <!-- LOGIN -->
    <div id="loginCard" class="ad-login">
        <div class="ad-login-icon"><i class="fas fa-lock" aria-hidden="true"></i></div>
        <h1>Mocha Tech Admin Panel</h1>
        <p id="loginHint">Enter your access PIN to log in.</p>
        <form id="loginForm" autocomplete="off">
            <input id="adminEmail" type="email" placeholder="Admin email" autocomplete="username" class="ad-input ad-center" hidden>
            <input id="adminPin" name="custom_secure_pin" type="password" placeholder="Enter PIN" autocomplete="new-password" required class="ad-input ad-center">
            <input id="adminPin2" type="password" placeholder="Repeat PIN" autocomplete="new-password" class="ad-input ad-center" hidden>
            <button type="submit" id="loginBtn" class="ad-btn ad-btn-primary ad-block">Unlock Dashboard</button>
            <p id="loginError" class="ad-error" hidden></p>
        </form>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" hidden>
        <header class="ad-head">
            <div>
                <h1>MOCHA<span>TECH</span> Admin Control Hub</h1>
                <p>Control prices, content, FAQ, contact details and the site on/off switch.</p>
            </div>
            <div class="ad-head-actions">
                <span id="statusPill" class="ad-pill"></span>
                <a href="index.html" target="_blank" class="ad-btn"><i class="fas fa-eye"></i> Live Site</a>
                <button id="logoutBtn" class="ad-btn ad-btn-danger"><i class="fas fa-sign-out-alt"></i> Log Out</button>
            </div>
        </header>
        <nav id="tabs" class="ad-tabs" aria-label="Admin sections"></nav>
        <main id="panels" class="ad-main"></main>
    </div>

    <div id="toast" class="ad-toast" role="status" aria-live="polite"></div>
    <script src="admin.js"></script>
</body>
</html>
